name: Build firmware

# Builds the standalone (Path B) RP2040 firmware and uploads the .uf2 artifact.
# Pushing a tag named v* also publishes that .uf2 as a GitHub release, so a
# ready-to-flash build always matches a known revision.
on:
  push:
    tags:
      - "v*"
    paths:
      - "firmware/path-b-standalone/**"
      - "firmware/display-esp32/**"
      - "tools/gen_display_species.py"
      - "tools/gen_display_sprites.py"
      - "webui/pokedata*.js"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/path-b-standalone/**"
      - "firmware/display-esp32/**"
      - "tools/gen_display_species.py"
      - "tools/gen_display_sprites.py"
      - "webui/pokedata*.js"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only used by the tag-triggered release step below
    env:
      PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
      # Pin the SDK for reproducible builds; bump deliberately.
      PICO_SDK_REF: "2.1.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Ubuntu's gcc-arm-none-eabi apt package ships incomplete C++ newlib
      # headers (the SDK compiles a couple of .cpp files), so use the official
      # Arm GNU toolchain instead.
      - name: Install Arm GNU toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "13.2.Rel1"

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential pkg-config libusb-1.0-0-dev

      - name: Checkout Pico SDK
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: ${{ env.PICO_SDK_REF }}
          path: pico-sdk
          submodules: false

      - name: Init TinyUSB submodule
        run: git -C pico-sdk submodule update --init --depth 1 lib/tinyusb

      # SDK 2.1.1's host-side pioasm relies on <cstdint> being pulled in
      # transitively, which the runner's GCC 15 no longer does ("'uint8_t' does
      # not name a type"). Add the include rather than moving the SDK pin; drop
      # this step when PICO_SDK_REF is bumped to a release that has the fix.
      - name: Patch pioasm for newer host GCC
        run: |
          sed -i '1i #include <cstdint>' \
            pico-sdk/tools/pioasm/pio_types.h \
            pico-sdk/tools/pioasm/output_format.h

      - name: Generate baked multiboot source
        run: ./scripts/setup.sh

      - name: Configure & build
        run: |
          cmake -S firmware/path-b-standalone -B firmware/path-b-standalone/build \
                -DCMAKE_BUILD_TYPE=Release
          cmake --build firmware/path-b-standalone/build -j "$(nproc)"

      - name: Show artifact info
        run: ls -la firmware/path-b-standalone/build/pico_ball_vault.uf2

      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: pico_ball_vault-uf2
          path: firmware/path-b-standalone/build/pico_ball_vault.uf2
          if-no-files-found: error

      # CI has no devkitARM, so this build carries the Poke Transporter GB stub
      # (the 'P' command reports "not baked into this build").
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          UF2=firmware/path-b-standalone/build/pico_ball_vault.uf2
          gh release create "$GITHUB_REF_NAME" "$UF2" \
              --title "pico_ball vault firmware $GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" "$UF2" --clobber

  build-touch-display:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test UART protocol parser
        run: |
          python3 tools/gen_display_species.py
          git diff --exit-code -- firmware/display-esp32/src/species_names.h
          g++ -std=c++17 -Wall -Wextra -Werror \
              -Ifirmware/display-esp32/src \
              firmware/display-esp32/src/protocol.cpp \
              firmware/display-esp32/src/decoder.cpp \
              firmware/display-esp32/test/test_protocol.cpp \
              -o /tmp/display-protocol-test
          /tmp/display-protocol-test
          g++ -std=c++17 -O0 -Wall -Wextra -Werror \
              -Ifirmware/display-esp32/src \
              firmware/display-esp32/src/sprite_data.cpp \
              firmware/display-esp32/test/test_sprites.cpp \
              -o /tmp/display-sprite-test
          /tmp/display-sprite-test

      - name: Install PlatformIO
        run: pipx install platformio==6.1.19

      - name: Build Hosyond E32R32P firmware
        run: platformio run -d firmware/display-esp32

      - name: Upload ESP32 binary
        uses: actions/upload-artifact@v4
        with:
          name: pico_ball-hosyond-e32r32p-bin
          path: firmware/display-esp32/.pio/build/hosyond-e32r32p/firmware.bin
          if-no-files-found: error
